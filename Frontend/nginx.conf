server {
    listen 80;
    server_name localhost;

    # Sirve el front-end construido por React+Vite
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Esto soluciona el problema de recarga de rutas en React Router
        try_files $uri $uri/ /index.html;
    }

    # Actúa como reverse-proxy para todas las peticiones a /api
    location /api/ {
        # 'backend' es el nombre del servicio declarado en docker-compose.yml
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
